<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - metgrs</title>
    <meta name="description" content="{{ page.description }}">
    <link rel="stylesheet" href="/metgrs/assets/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        .doc-layout {
            display: flex;
            min-height: 100vh;
            padding-top: 70px;
        }

        .doc-sidebar {
            width: 280px;
            background: #0f172a;
            border-right: 1px solid #1e293b;
            padding: 24px 0;
            position: fixed;
            top: 70px;
            bottom: 0;
            overflow-y: auto;
        }

        .doc-sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .doc-sidebar::-webkit-scrollbar-track {
            background: #0f172a;
        }

        .doc-sidebar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0 24px;
            margin-bottom: 12px;
        }

        .sidebar-nav {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-nav li {
            margin: 0;
        }

        .sidebar-nav a {
            display: block;
            padding: 10px 24px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .sidebar-nav a:hover {
            background: rgba(37, 99, 235, 0.1);
            color: #3b82f6;
        }

        .sidebar-nav a.active {
            background: rgba(37, 99, 235, 0.15);
            color: #3b82f6;
            border-left-color: #3b82f6;
            font-weight: 500;
        }

        .doc-content {
            flex: 1;
            margin-left: 280px;
            padding: 40px 60px;
            max-width: 900px;
        }

        .doc-content h1 {
            font-size: 32px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #1e293b;
        }

        .doc-content h2 {
            font-size: 24px;
            font-weight: 600;
            color: #f8fafc;
            margin-top: 48px;
            margin-bottom: 16px;
        }

        .doc-content h3 {
            font-size: 20px;
            font-weight: 600;
            color: #e2e8f0;
            margin-top: 32px;
            margin-bottom: 12px;
        }

        .doc-content p {
            color: #94a3b8;
            line-height: 1.8;
            margin-bottom: 16px;
        }

        .doc-content a {
            color: #3b82f6;
            text-decoration: none;
        }

        .doc-content a:hover {
            text-decoration: underline;
        }

        .doc-content code {
            background: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: #e2e8f0;
        }

        .doc-content pre {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            margin-bottom: 16px;
        }

        .doc-content pre code {
            background: none;
            padding: 0;
        }

        .doc-content table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
        }

        .doc-content th,
        .doc-content td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #1e293b;
        }

        .doc-content th {
            background: #1e293b;
            color: #f8fafc;
            font-weight: 600;
        }

        .doc-content td {
            color: #94a3b8;
        }

        .doc-content ul,
        .doc-content ol {
            color: #94a3b8;
            padding-left: 24px;
            margin-bottom: 16px;
        }

        .doc-content li {
            margin-bottom: 8px;
            line-height: 1.6;
        }

        .doc-content blockquote {
            border-left: 4px solid #3b82f6;
            padding: 12px 16px;
            background: rgba(37, 99, 235, 0.1);
            margin-bottom: 16px;
        }

        .doc-content blockquote p {
            margin: 0;
        }

        .doc-content hr {
            border: none;
            border-top: 1px solid #1e293b;
            margin: 32px 0;
        }

        .doc-content img {
            max-width: 100%;
            border-radius: 8px;
        }

        @media (max-width: 768px) {
            .doc-sidebar {
                display: none;
            }

            .doc-content {
                margin-left: 0;
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="/metgrs/" class="logo">
                <span class="logo-icon">📡</span>
                <span class="logo-text">metgrs</span>
            </a>
            <ul class="nav-links">
                <li><a href="/metgrs/">首页</a></li>
                <li><a href="/metgrs/metgrs接口参考文档.html">API 文档</a></li>
                <li><a href="/metgrs/Python环境管理与编译工具教程.html">教程</a></li>
                <li><a href="https://github.com/longtsing/metgrs" target="_blank" class="github-link">
                    <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                    </svg>
                    GitHub
                </a></li>
            </ul>
        </div>
    </nav>

    <div class="doc-layout">
        <!-- Sidebar -->
        <aside class="doc-sidebar">
            <div class="sidebar-title">文档导航</div>
            <ul class="sidebar-nav">
                <li><a href="/metgrs/metgrs接口参考文档.html" {% if page.title == 'metgrs API 参考文档' %}class="active"{% endif %}>API 参考文档</a></li>
                <li><a href="/metgrs/Python环境管理与编译工具教程.html" {% if page.title == 'Python 环境管理与编译工具教程' %}class="active"{% endif %}>环境管理教程</a></li>
                <li><a href="/metgrs/Python包分发与安装机制详解.html" {% if page.title == 'Python 包分发与安装机制详解' %}class="active"{% endif %}>包分发机制</a></li>
                <li><a href="/metgrs/matplotlib中文字体配置教程.html" {% if page.title == 'Matplotlib 中文显示配置教程' %}class="active"{% endif %}>中文字体配置</a></li>
                <li><a href="/metgrs/msvc编译器安装教程.html" {% if page.title == 'MSVC 编译器安装教程' %}class="active"{% endif %}>编译器安装</a></li>
                <li><a href="/metgrs/社区贡献指南.html" {% if page.title == 'metgrs 社区贡献指南' %}class="active"{% endif %}>社区贡献指南</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="doc-content">
            {{ content }}
        </main>
    </div>

    <script src="/metgrs/assets/script.js"></script>
</body>
</html>
